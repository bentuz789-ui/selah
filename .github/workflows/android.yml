# Builds the Android app whenever main changes. Download it from the run's page:
# Actions › Android app › the latest run › Artifacts › Selah-android (README, "Install on Android").
name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      # Push notifications: add the Firebase file as the repository secret GOOGLE_SERVICES_JSON
      # (README, "Turn on push notifications"). Without it the app builds with push turned off.
      - name: Add Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          sed -i 's/androidPush: false/androidPush: true/' www/config.js
          grep -q 'androidPush: true' www/config.js

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Selah-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
